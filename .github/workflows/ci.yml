name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  # ============================================================
  backend:
    name: Backend · lint + pruebas + cobertura
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: migrapatron_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (black)
        run: black --check .

      - name: Pruebas + cobertura
        env:
          SECRET_KEY: clave-solo-para-ci
          DEBUG: 'False'
          DB_NAME: migrapatron_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: '5432'
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/coverage.xml

  # ============================================================
  web:
    name: Web · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ============================================================
  movil:
    name: Móvil · analyze + pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  # ============================================================
  # Quality Gate. Requiere el secreto SONAR_TOKEN en el repositorio.
  # Hasta configurarlo, este job se salta solo y no bloquea el PR.
  sonar:
    name: SonarCloud · Quality Gate
    runs-on: ubuntu-latest
    needs: [backend, web, movil]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura del backend
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend

      - name: Escaneo SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
