[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py tests.py *_test.py
addopts =
    --strict-markers
    --cov=apps
    --cov-report=term-missing
    --cov-report=xml
testpaths = apps
markers =
    oraculo: pruebas de oraculo del motor (patron sembrado conocido)
    lento: pruebas que tardan mas de un segundo
