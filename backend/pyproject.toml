[tool.ruff]
line-length = 90
target-version = "py312"
exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ"]
ignore = [
    "E501",   # el largo de línea lo controla black
    "B008",   # llamada en argumento por defecto: común en DRF
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.black]
line-length = 90
target-version = ["py312"]
extend-exclude = "(venv|migrations)"
